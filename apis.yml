name: Aaptiv
description: 'Aaptiv is a digital fitness and wellness platform offering 10,000+ on-demand audio
  and video workout classes, AI-powered coaching, access to a network of gyms and studios, and
  wellness resources such as meditation and mindfulness. It is sold to employers as an employee
  benefit, to health plans, and to individuals seeking personalized fitness. Backed by Insight
  Partners. Aaptiv publishes no public developer API, SDK, or developer portal at this time; this
  API Evangelist profile captures its public web, support, and domain-security posture.'
